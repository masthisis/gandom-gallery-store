name: Payment Harness

on:
  push:
    branches: [master]
    paths:
      - 'backend/**'
      - 'tests/payment-harness/**'
      - 'scripts/payment-harness.sh'
  pull_request:
    paths:
      - 'backend/**'
      - 'tests/payment-harness/**'
      - 'scripts/payment-harness.sh'

jobs:
  payment-harness:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Start stack
        run: |
          cp backend/.env.example backend/.env
          docker compose up -d postgres strapi
          chmod +x scripts/wait-for-url.sh scripts/payment-harness.sh

      - name: Wait for Strapi
        run: ./scripts/wait-for-url.sh http://localhost:1337/api/store-setting 300

      - name: Run payment harness (integration)
        run: |
          cd tests/payment-harness
          npm ci
          npx tsx lib/digipay-stub.ts &
          sleep 2
          npm run test:integration
