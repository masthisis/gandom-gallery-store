server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2
        application/font-woff2;

    # Proxy /uploads to Strapi so media never hits the SPA fallback
    location /uploads/ {
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host api.gandomshop.com;
        proxy_pass https://api.gandomshop.com;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=86400" always;
        expires 1d;
    }

    # Vite hashed assets — immutable
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    location /fonts/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
